---
# Namespace for the Claude Agent
apiVersion: v1
kind: Namespace
metadata:
  name: claude
  labels:
    name: claude
    app: crystalshards-agent

---
# Service Account for the Claude Agent
apiVersion: v1
kind: ServiceAccount
metadata:
  name: claude-agent
  namespace: claude

---
# ClusterRole with necessary permissions for SRE troubleshooting
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: claude-agent-role
rules:
# Namespace access
- apiGroups: [""]
  resources: ["namespaces"]
  verbs: ["get", "list", "watch"]

# Pod management and inspection
- apiGroups: [""]
  resources: ["pods", "pods/log", "pods/status"]
  verbs: ["get", "list", "watch"]

# Deployment inspection
- apiGroups: ["apps"]
  resources: ["deployments", "deployments/status", "replicasets", "statefulsets"]
  verbs: ["get", "list", "watch"]

# Service inspection
- apiGroups: [""]
  resources: ["services", "endpoints", "configmaps"]
  verbs: ["get", "list", "watch"]

# Secret inspection (read-only for troubleshooting)
- apiGroups: [""]
  resources: ["secrets"]
  verbs: ["get", "list"]

# Events for troubleshooting
- apiGroups: [""]
  resources: ["events"]
  verbs: ["get", "list", "watch"]

# PVC and storage
- apiGroups: [""]
  resources: ["persistentvolumeclaims", "persistentvolumes"]
  verbs: ["get", "list", "watch"]

# Ingress and networking
- apiGroups: ["networking.k8s.io"]
  resources: ["ingresses", "networkpolicies"]
  verbs: ["get", "list", "watch"]

# Custom resources for operators - CloudNativePG
- apiGroups: ["postgresql.cnpg.io"]
  resources: ["clusters", "backups", "scheduledbackups"]
  verbs: ["get", "list", "watch"]

# Redis Operator
- apiGroups: ["redis.redis.opstreelabs.in"]
  resources: ["redis", "redisclusters"]
  verbs: ["get", "list", "watch"]

# MinIO Operator
- apiGroups: ["minio.min.io"]
  resources: ["tenants"]
  verbs: ["get", "list", "watch"]

# Gateway API resources
- apiGroups: ["gateway.networking.k8s.io"]
  resources: ["gateways", "httproutes", "gatewayclasses"]
  verbs: ["get", "list", "watch"]

# Cert-manager resources
- apiGroups: ["cert-manager.io"]
  resources: ["certificates", "certificaterequests", "issuers", "clusterissuers"]
  verbs: ["get", "list", "watch"]

# Monitoring resources
- apiGroups: ["monitoring.coreos.com"]
  resources: ["servicemonitors", "prometheusrules", "podmonitors"]
  verbs: ["get", "list", "watch"]

# Nodes (for cluster health)
- apiGroups: [""]
  resources: ["nodes"]
  verbs: ["get", "list", "watch"]

# RBAC inspection
- apiGroups: ["rbac.authorization.k8s.io"]
  resources: ["roles", "rolebindings", "clusterroles", "clusterrolebindings"]
  verbs: ["get", "list", "watch"]

---
# ClusterRoleBinding to bind the role to the service accounts
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: claude-agent-binding
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: claude-agent-role
subjects:
# Bind to claude-agent service account
- kind: ServiceAccount
  name: claude-agent
  namespace: claude
# Also bind to default service account for backward compatibility
- kind: ServiceAccount
  name: default
  namespace: claude
