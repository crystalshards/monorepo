name: Continuous Integration

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

env:
  CRYSTAL_VERSION: "1.17.1"

jobs:
  # Test Lucky applications
  test:
    name: Test Lucky Apps
    runs-on: ubuntu-latest
    strategy:
      matrix:
        app: [crystalshards, crystaldocs, crystalgigs, crystalbits]

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

      # CrystalDocs reads documentation from object storage, and the spec that
      # guards against ever serving shard-authored HTML again has to plant a
      # real object to prove anything. The env below already pointed at MinIO;
      # only the service was missing.
      minio:
        image: bitnami/minio:latest
        env:
          MINIO_ROOT_USER: minioadmin
          MINIO_ROOT_PASSWORD: minioadmin
        options: >-
          --health-cmd "curl -f http://localhost:9000/minio/health/live"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
        ports:
          - 9000:9000

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Crystal
        uses: crystal-lang/install-crystal@v1
        with:
          crystal: ${{ env.CRYSTAL_VERSION }}

      - name: Install dependencies
        working-directory: ./apps/${{ matrix.app }}
        run: |
          echo "Installing dependencies for ${{ matrix.app }}..."
          shards install

      - name: Build ${{ matrix.app }}
        working-directory: ./apps/${{ matrix.app }}
        run: |
          echo "Building ${{ matrix.app }}..."
          crystal build --no-codegen src/${{ matrix.app }}.cr
          echo "Build successful!"

      - name: Run specs
        working-directory: ./apps/${{ matrix.app }}
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/${{ matrix.app }}_test
          MINIO_ENDPOINT: http://localhost:9000
          MINIO_ACCESS_KEY: minioadmin
          MINIO_SECRET_KEY: minioadmin
          MINIO_BUCKET: test-bucket
        run: |
          echo "Running specs for ${{ matrix.app }}..."
          crystal spec

      - name: Format check
        working-directory: ./apps/${{ matrix.app }}
        run: |
          echo "Checking Crystal formatting for ${{ matrix.app }}..."
          crystal tool format --check src/

  # Security scanning
  security:
    name: Security Scanning
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      security-events: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: "fs"
          scan-ref: "."
          format: "sarif"
          output: "trivy-results.sarif"

      - name: Upload Trivy scan results to GitHub Security tab
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: "trivy-results.sarif"
        continue-on-error: true

  # Terraform validation
  terraform:
    name: Terraform Validation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: "${{ secrets.GCP_SA_KEY }}"

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v2
        with:
          # 1.6.0 embeds a HashiCorp GPG key that has since expired, so it can
          # no longer verify any provider release ("openpgp: key expired").
          terraform_version: 1.15.8

      - name: Terraform Format
        working-directory: ./terraform
        run: terraform fmt -check

      - name: Terraform Init
        working-directory: ./terraform
        run: terraform init -backend=false

      - name: Terraform Validate
        working-directory: ./terraform
        run: terraform validate
