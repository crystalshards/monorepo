name: Continuous Integration

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

env:
  CRYSTAL_VERSION: "1.10.1"

jobs:
  # Test simple deployable apps
  test:
    name: Test Simple Apps
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Install Crystal
      uses: crystal-lang/install-crystal@v1
      with:
        crystal: ${{ env.CRYSTAL_VERSION }}

    - name: Build crystalshards
      working-directory: ./apps/crystalshards
      run: |
        echo "Building crystalshards..."
        crystal build src/simple-registry.cr
        echo "Build successful!"

    - name: Test crystalshards
      working-directory: ./apps/crystalshards
      run: |
        echo "Testing crystalshards compilation..."
        crystal build --no-codegen src/simple-registry.cr
        echo "Compilation test passed!"

    # TODO: Re-enable simple-lucky-registry once MainLayout is implemented
    # - name: Build simple-lucky-registry
    #   working-directory: ./apps/simple-lucky-registry
    #   run: |
    #     echo "Building simple-lucky-registry..."
    #     if [ -f "shard.yml" ]; then
    #       echo "Installing dependencies..."
    #       shards install
    #       echo "Building application..."
    #       crystal build --no-codegen src/simple-lucky-registry.cr
    #       echo "Build successful!"
    #     else
    #       echo "No shard.yml found for simple-lucky-registry, skipping"
    #     fi
    #
    # - name: Test simple-lucky-registry
    #   working-directory: ./apps/simple-lucky-registry
    #   run: |
    #     if [ -f "shard.yml" ]; then
    #       echo "Testing simple-lucky-registry syntax..."
    #       crystal build --no-codegen src/simple-lucky-registry.cr
    #       echo "Compilation test passed!"
    #     else
    #       echo "No shard.yml found for simple-lucky-registry, skipping"
    #     fi

    - name: Format check for simple apps
      run: |
        echo "Checking Crystal formatting for simple apps..."
        crystal tool format --check apps/crystalshards/src/


  # Security scanning
  security:
    name: Security Scanning
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      security-events: write
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Run Trivy vulnerability scanner
      uses: aquasecurity/trivy-action@master
      with:
        scan-type: 'fs'
        scan-ref: '.'
        format: 'sarif'
        output: 'trivy-results.sarif'

    - name: Upload Trivy scan results to GitHub Security tab
      uses: github/codeql-action/upload-sarif@v3
      if: always()
      with:
        sarif_file: 'trivy-results.sarif'
      continue-on-error: true

  # Terraform validation
  terraform:
    name: Terraform Validation
    runs-on: ubuntu-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Authenticate to Google Cloud
      uses: google-github-actions/auth@v2
      with:
        credentials_json: '${{ secrets.GCP_SA_KEY }}'

    - name: Setup Terraform
      uses: hashicorp/setup-terraform@v2
      with:
        terraform_version: 1.6.0

    - name: Terraform Format
      working-directory: ./terraform
      run: terraform fmt -check

    - name: Terraform Init
      working-directory: ./terraform
      run: terraform init

    - name: Terraform Validate
      working-directory: ./terraform
      run: terraform validate