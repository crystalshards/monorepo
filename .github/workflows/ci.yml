name: Continuous Integration

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

env:
  CRYSTAL_VERSION: "1.17.1"

jobs:
  # Test Lucky applications
  test:
    name: Test Lucky Apps
    runs-on: ubuntu-latest
    strategy:
      matrix:
        app: [crystalshards, crystaldocs, crystalgigs, crystalbits]

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

    # MinIO is started as a step rather than a service container: the official
    # image needs `server /data` as its command, and service containers cannot
    # override a command. bitnami/minio, which can, no longer publishes a
    # public tag.

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # CrystalDocs reads documentation from object storage, and the spec that
      # guards against ever serving shard-authored HTML again has to plant a
      # real object to prove anything. This is the development backend of the
      # apps' object store interface; the apps read backend-neutral STORAGE_*
      # below and never name a backend themselves.
      - name: Start object storage
        run: |
          docker run -d --name minio \
            -p 9000:9000 \
            -e MINIO_ROOT_USER=minioadmin \
            -e MINIO_ROOT_PASSWORD=minioadmin \
            minio/minio:latest server /data
          for _ in $(seq 1 30); do
            if curl -fsS http://localhost:9000/minio/health/live >/dev/null 2>&1; then
              echo "Object storage is up"
              exit 0
            fi
            sleep 2
          done
          echo "Object storage did not become healthy"
          docker logs minio || true
          exit 1

      - name: Install Crystal
        uses: crystal-lang/install-crystal@v1
        with:
          crystal: ${{ env.CRYSTAL_VERSION }}

      - name: Install dependencies
        working-directory: ./apps/${{ matrix.app }}
        run: |
          echo "Installing dependencies for ${{ matrix.app }}..."
          shards install

      - name: Build ${{ matrix.app }}
        working-directory: ./apps/${{ matrix.app }}
        run: |
          set -euo pipefail
          echo "Building ${{ matrix.app }}..."
          crystal build --no-codegen src/${{ matrix.app }}.cr

          # The migration entrypoint is a second binary that the ${{ matrix.app }}-migrate
          # Cloud Run Job runs, and nothing else compiles it. Without this, a broken
          # migrator ships green and is only discovered when a deploy tries to migrate.
          echo "Building the migration entrypoint..."
          crystal build --no-codegen src/migrate.cr

          echo "Build successful!"

      - name: Run specs
        working-directory: ./apps/${{ matrix.app }}
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/${{ matrix.app }}_test
          STORAGE_ENDPOINT: http://localhost:9000
          STORAGE_ACCESS_KEY: minioadmin
          STORAGE_SECRET_KEY: minioadmin
          DOCS_BUCKET: crystaldocs-test
          PACKAGES_BUCKET: packages-test
          # Required by every app with no default in the code, one per
          # public site. The values are irrelevant to a spec; that all four
          # are set is the point.
          SHARDS_SITE_ORIGIN: http://localhost:3000
          DOCS_SITE_ORIGIN: http://localhost:3001
          # Required by the apps with no default in the code: the ad strip's
          # house-ad fallback and the footer's cross site links. Same
          # reasoning as DOCS_SITE_ORIGIN above.
          GIGS_SITE_ORIGIN: http://localhost:3002
          BITS_SITE_ORIGIN: http://localhost:3003
        run: |
          echo "Running specs for ${{ matrix.app }}..."
          crystal spec

      - name: Format check
        working-directory: ./apps/${{ matrix.app }}
        run: |
          set -euo pipefail

          # Every tree that gets hand edited, not just src/. Checking src/ alone let
          # unformatted config/ and spec/ files through, and a check that covers a
          # subset is indistinguishable from one that covers everything until it is not.
          targets=()
          for t in src spec config db tasks tasks.cr; do
            [ -e "$t" ] && targets+=("$t")
          done

          # Positive control: an empty target list would make the check pass by
          # scanning nothing, which is exactly the failure being fixed here.
          if [ "${#targets[@]}" -eq 0 ]; then
            echo "No Crystal source trees found in apps/${{ matrix.app }}." >&2
            exit 1
          fi

          echo "Checking Crystal formatting for ${{ matrix.app }}: ${targets[*]}"
          crystal tool format --check "${targets[@]}"

  # Two things that reached main once each and that nothing else here would
  # have caught.
  #
  # A merge resolved with `git add -A` after a truncated `git status` committed
  # conflict markers into docker-compose.yml. Every Crystal check passed,
  # because the file holds no Crystal, and the break only showed up when
  # somebody tried to bring the stack up locally.
  #
  # The compose file is the local development contract. It is not deployed, so
  # no deploy job validates it, which is exactly why it can rot unnoticed.
  repo-hygiene:
    name: Repository Hygiene
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Refuse conflict markers in tracked files
        shell: bash
        run: |
          set -uo pipefail

          # Anchored to the start of a line and requiring the trailing space or
          # end of line that git writes, so prose about conflicts and a row of
          # equals signs in a comment do not trip it.
          if git grep -nE '^(<{7}|>{7}) |^={7}$' -- . > /tmp/markers.txt; then
            echo "Conflict markers are committed in these files:" >&2
            cat /tmp/markers.txt >&2
            exit 1
          fi
          echo "No conflict markers in tracked files."

      - name: Check docker-compose.yml parses and has no duplicate keys
        shell: bash
        run: |
          set -euo pipefail

          # Duplicate keys are the second half of this: YAML takes the last one
          # silently, so a service can carry two values for one variable and
          # run with whichever came last.
          python3 - <<'PY'
          import collections, sys, yaml

          class Strict(yaml.SafeLoader):
              pass

          def no_duplicate_keys(loader, node, deep=False):
              keys = [loader.construct_object(k, deep=deep) for k, _ in node.value]
              repeated = [k for k, n in collections.Counter(keys).items() if n > 1]
              if repeated:
                  sys.exit(f"docker-compose.yml repeats {repeated} at {node.start_mark}")
              return yaml.SafeLoader.construct_mapping(loader, node, deep)

          Strict.add_constructor(yaml.resolver.BaseResolver.DEFAULT_MAPPING_TAG, no_duplicate_keys)

          with open("docker-compose.yml") as handle:
              document = yaml.load(handle, Strict)

          services = document.get("services") or {}
          if not services:
              sys.exit("docker-compose.yml declares no services, so this check proved nothing.")

          print(f"docker-compose.yml parses, {len(services)} services, no duplicate keys.")
          PY

  # The deploy decides whether docs-launcher will accept a build token by
  # running two jq programs against the live service description. Both have
  # been wrong in production: one read a path Cloud Run does not use and
  # failed a release whose configuration was correct and working.
  #
  # The deploy reads these same files, so this cannot drift from what actually
  # runs.
  deploy-selectors:
    name: Deploy Selector Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Test the docs-launcher audience selectors
        shell: bash
        run: bash .github/jq/selectors_test.sh

      # Terraform validate cannot see this: it checks the configuration, not
      # what the workflow reads out of it. A release job asking for a root
      # output that only exists on a module passes every check in this file
      # and then kills the deploy after the images are built and the
      # production databases are migrated.
      - name: Check the deploy's terraform output wiring
        shell: bash
        run: bash .github/deploy_outputs_test.sh

  # Security scanning
  security:
    name: Security Scanning
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      security-events: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: "fs"
          scan-ref: "."
          format: "sarif"
          output: "trivy-results.sarif"

      - name: Upload Trivy scan results to GitHub Security tab
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: "trivy-results.sarif"
        continue-on-error: true

  # Terraform validation
  terraform:
    name: Terraform Validation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: "${{ secrets.GCP_SA_KEY }}"

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v2
        with:
          # 1.6.0 embeds a HashiCorp GPG key that has since expired, so it can
          # no longer verify any provider release ("openpgp: key expired").
          terraform_version: 1.15.8

      - name: Terraform Format
        working-directory: ./terraform
        run: terraform fmt -check

      - name: Terraform Init
        working-directory: ./terraform
        run: terraform init -backend=false

      - name: Terraform Validate
        working-directory: ./terraform
        run: terraform validate
