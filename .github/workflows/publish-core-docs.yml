name: Publish core docs

on:
  workflow_dispatch:

jobs:
  publish-core-docs:
    name: Execute publish-core-docs Job
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: production
    steps:
      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Execute the publish-core-docs Job
        shell: bash
        env:
          PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
          REGION: us-central1
        run: |
          set -euo pipefail

          # One recorded bootstrap operation, run from CI rather than a laptop.
          # The job itself is idempotent from the artifact: it checks whether
          # crystal/<pinned-version>/docs.json already exists and, if so, marks
          # the database row succeeded again from that fact and exits without
          # cloning or compiling anything.
          gcloud run jobs execute publish-core-docs \
            --project "$PROJECT_ID" \
            --region "$REGION" \
            --wait
