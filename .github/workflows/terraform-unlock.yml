name: Force Unlock Terraform State

on:
  workflow_dispatch:
    inputs:
      lock_id:
        description: 'Lock ID to force unlock'
        required: true
        type: string

# Prevent concurrent unlock operations
concurrency:
  group: terraform-unlock
  cancel-in-progress: false

jobs:
  force-unlock:
    name: Force Unlock Terraform State
    runs-on: ubuntu-latest
    environment: production

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Authenticate to Google Cloud
      uses: google-github-actions/auth@v2
      with:
        credentials_json: ${{ secrets.GCP_SA_KEY }}

    - name: Setup Terraform
      uses: hashicorp/setup-terraform@v3
      with:
        # 1.15.8, matching ci.yml, deploy.yml and teardown-gke.yml. NOT 1.6.0:
        # that release's embedded HashiCorp key has expired, so `terraform init`
        # can no longer verify any provider and dies with "openpgp: key expired".
        # This is a wall-clock failure rather than a version-compatibility one,
        # so an older pin is not the conservative choice here, it is the broken
        # one. Keep all four workflows on the same version.
        terraform_version: 1.15.8
        terraform_wrapper: false

    - name: Force Unlock State
      working-directory: ./terraform
      shell: bash
      env:
        LOCK_ID: ${{ inputs.lock_id }}
      run: |
        set -euo pipefail

        # Neither `init` nor `force-unlock` evaluates input variables: both operate on
        # the backend rather than the configuration. So this workflow needs no
        # application secrets, and it should not be handed any.
        echo "Initializing Terraform..."
        terraform init

        echo "Force unlocking state with Lock ID: ${LOCK_ID}"
        terraform force-unlock -force "${LOCK_ID}"

        echo "Lock removed."

    - name: Verify State Accessible
      working-directory: ./terraform
      shell: bash
      run: |
        set -euo pipefail

        # `terraform state list` reads the state directly, so unlike `plan` it needs no
        # input variables and cannot start failing because an unrelated variable was
        # renamed. The lock itself is already proven gone by force-unlock succeeding
        # above; what is left to confirm is that the state is readable and intact.
        echo "Verifying state is readable..."
        resources="$(terraform state list)"
        count="$(printf '%s' "$resources" | grep -c . || true)"

        # A readable but empty state would also print nothing and exit 0, so require a
        # non-zero count rather than treating silence as success.
        if [ "$count" -eq 0 ]; then
          echo "State is readable but lists no resources. That is not what an unlock should leave behind." >&2
          exit 1
        fi

        echo "State is accessible and lists ${count} resource(s)."
