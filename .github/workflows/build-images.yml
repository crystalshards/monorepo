name: Build and Push Docker Images

on:
  push:
    branches: [ main ]
    paths:
      - 'apps/**'
      - '.github/workflows/build-images.yml'
  workflow_dispatch:

env:
  REGISTRY: us-docker.pkg.dev
  REPOSITORY: crystalshards  # Artifact Registry repository name

jobs:
  build-and-push:
    name: Build and Push ${{ matrix.app }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      max-parallel: 1  # Build one image at a time to avoid resource contention
      matrix:
        app: [crystalshards, crystaldocs, crystalgigs, crystalbits]
        target: [api, worker]
        exclude:
          # Only crystalshards has workers
          - app: crystaldocs
            target: worker
          - app: crystalgigs
            target: worker
          - app: crystalbits
            target: worker

    permissions:
      contents: read
      id-token: write

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Authenticate to Google Cloud
      uses: google-github-actions/auth@v2
      with:
        credentials_json: ${{ secrets.GCP_SA_KEY }}

    - name: Set up Cloud SDK
      uses: google-github-actions/setup-gcloud@v2

    - name: Configure Docker for Artifact Registry
      run: gcloud auth configure-docker us-docker.pkg.dev

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3
      with:
        driver-opts: |
          image=moby/buildkit:latest

    - name: Set image tags
      id: tags
      run: |
        APP="${{ matrix.app }}"
        TARGET="${{ matrix.target }}"
        PROJECT_ID="${{ secrets.GCP_PROJECT_ID }}"
        SHA="${GITHUB_SHA::8}"

        if [ "$TARGET" = "worker" ]; then
          IMAGE_NAME="${APP}-worker"
        else
          IMAGE_NAME="${APP}"
        fi

        echo "image_name=${IMAGE_NAME}" >> $GITHUB_OUTPUT
        echo "full_image=$REGISTRY/$PROJECT_ID/$REPOSITORY/$IMAGE_NAME:$SHA" >> $GITHUB_OUTPUT
        echo "latest_image=$REGISTRY/$PROJECT_ID/$REPOSITORY/$IMAGE_NAME:latest" >> $GITHUB_OUTPUT

    - name: Build Docker image
      working-directory: ./apps/${{ matrix.app }}
      run: |
        echo "Building ${{ steps.tags.outputs.image_name }}..."

        BUILD_ARG=""
        if [ "${{ matrix.target }}" = "worker" ]; then
          BUILD_ARG="--build-arg BUILD_TARGET=worker"
        fi

        # Use buildx for faster builds
        # Skip cache for now (images don't exist yet in registry)
        docker buildx build $BUILD_ARG \
          --load \
          -t ${{ steps.tags.outputs.full_image }} \
          -t ${{ steps.tags.outputs.latest_image }} \
          .

    - name: Push Docker image
      run: |
        echo "Pushing ${{ steps.tags.outputs.image_name }} to GCR..."
        docker push ${{ steps.tags.outputs.full_image }}
        docker push ${{ steps.tags.outputs.latest_image }}
        echo "✅ Image pushed: ${{ steps.tags.outputs.latest_image }}"

    - name: Image summary
      run: |
        echo "## 📦 Docker Image Built" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "**App**: ${{ matrix.app }}" >> $GITHUB_STEP_SUMMARY
        echo "**Target**: ${{ matrix.target }}" >> $GITHUB_STEP_SUMMARY
        echo "**Image**: \`${{ steps.tags.outputs.latest_image }}\`" >> $GITHUB_STEP_SUMMARY
        echo "**SHA Tag**: \`${{ steps.tags.outputs.full_image }}\`" >> $GITHUB_STEP_SUMMARY

  update-deployments:
    name: Update Kubernetes Deployments
    runs-on: ubuntu-latest
    needs: build-and-push
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    permissions:
      contents: read
      id-token: write

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Authenticate to Google Cloud
      uses: google-github-actions/auth@v2
      with:
        credentials_json: ${{ secrets.GCP_SA_KEY }}

    - name: Set up Cloud SDK
      uses: google-github-actions/setup-gcloud@v2

    - name: Get GKE credentials
      run: |
        gcloud container clusters get-credentials crystalshards \
          --region=us-central1 \
          --project=${{ secrets.GCP_PROJECT_ID }}

    - name: Restart deployments
      run: |
        echo "Restarting deployments to pull new images..."
        kubectl rollout restart deployment -n crystalshards crystalshards-api || true
        kubectl rollout restart deployment -n crystalshards crystalshards-worker || true
        kubectl rollout restart deployment -n crystaldocs crystaldocs-api || true
        kubectl rollout restart deployment -n crystalgigs crystalgigs-api || true
        kubectl rollout restart deployment -n crystalbits crystalbits-api || true
        echo "✅ Deployments restarted"
