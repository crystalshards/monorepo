name: Deploy to Production

on:
  # Auto-deploy after CI passes on main
  workflow_run:
    workflows: ["Continuous Integration"]
    branches: [main]
    types:
      - completed
  # Allow manual deployment with approval
  workflow_dispatch:
    inputs:
      target:
        description: 'Terraform target (e.g., module.cluster for cluster only)'
        required: false
        type: string

jobs:
  deploy:
    name: Deploy GKE Infrastructure
    runs-on: ubuntu-latest
    environment: production
    # Only deploy if CI passed or manual trigger
    if: >
      github.event_name == 'workflow_dispatch' ||
      github.event.workflow_run.conclusion == 'success'

    steps:
    - name: Check CI Status
      if: github.event_name == 'workflow_run'
      run: |
        echo "CI workflow conclusion: ${{ github.event.workflow_run.conclusion }}"
        if [ "${{ github.event.workflow_run.conclusion }}" != "success" ]; then
          echo "❌ CI failed. Deployment blocked."
          exit 1
        fi
        echo "✅ CI passed. Proceeding with deployment."

    - name: Checkout code
      uses: actions/checkout@v4

    - name: Authenticate to Google Cloud
      uses: google-github-actions/auth@v2
      with:
        credentials_json: ${{ secrets.GCP_SA_KEY }}

    - name: Setup Terraform
      uses: hashicorp/setup-terraform@v2
      with:
        terraform_version: 1.6.0
        cli_config_credentials_token: ${{ secrets.TF_API_TOKEN }}

    - name: Deploy with Terraform
      working-directory: ./terraform
      run: |
        echo "Deploying GKE Autopilot cluster and infrastructure..."

        # Initialize Terraform (GCS backend configured in main.tf)
        terraform init

        # Build terraform command with optional target
        TARGET_FLAG=""
        if [ -n "${{ inputs.target }}" ]; then
          TARGET_FLAG="-target=${{ inputs.target }}"
          echo "Using targeted apply: ${{ inputs.target }}"
        fi

        # Plan the deployment
        terraform plan -var="project_id=${{ secrets.GCP_PROJECT_ID }}" \
                      -var="region=us-central1" \
                      $TARGET_FLAG \
                      -out=tfplan

        # Apply the deployment
        terraform apply tfplan

        echo "Deployment completed!"

    - name: Get cluster info
      working-directory: ./terraform
      run: |
        echo "Getting cluster information..."
        terraform output cluster_name
        terraform output kubectl_config

        # Get ingress load balancer IP (may not be ready yet)
        echo "Ingress LoadBalancer IP:"
        terraform output load_balancer_ip

    - name: Update status
      run: |
        echo "✅ Infrastructure deployment completed successfully!"
        echo "📦 GKE Autopilot cluster is ready"
        echo "🔧 Operators installed: cert-manager, Traefik, Redis, PostgreSQL (CNPG), MinIO"
        echo "📝 Artifact Registry is ready for Docker images"
        echo ""
        echo "Docker images will be built automatically when apps/** changes are pushed"