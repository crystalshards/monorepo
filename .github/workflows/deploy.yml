name: Deploy to Production

on:
  # Deploy after CI passes and images are built
  workflow_run:
    workflows: ["Build and Push Docker Images"]
    branches: [main]
    types:
      - completed
  # Allow manual deployment with approval
  workflow_dispatch:

jobs:
  deploy:
    name: Deploy GKE Infrastructure
    runs-on: ubuntu-latest
    environment: production
    # Only run if image build passed or if manually triggered
    if: >
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success')

    steps:
    - name: Check Image Build Status
      if: github.event_name == 'workflow_run'
      run: |
        echo "Image build workflow conclusion: ${{ github.event.workflow_run.conclusion }}"
        if [ "${{ github.event.workflow_run.conclusion }}" != "success" ]; then
          echo "❌ Image build failed. Deployment blocked."
          exit 1
        fi
        echo "✅ Docker images built and pushed. Proceeding with deployment."

    - name: Checkout code
      uses: actions/checkout@v4

    - name: Authenticate to Google Cloud
      uses: google-github-actions/auth@v2
      with:
        credentials_json: ${{ secrets.GCP_SA_KEY }}

    - name: Setup Terraform
      uses: hashicorp/setup-terraform@v2
      with:
        terraform_version: 1.6.0
        cli_config_credentials_token: ${{ secrets.TF_API_TOKEN }}

    - name: Deploy with Terraform
      working-directory: ./terraform
      run: |
        echo "Deploying GKE Autopilot cluster and infrastructure..."

        # Initialize Terraform (GCS backend configured in main.tf)
        terraform init

        # Plan the deployment
        terraform plan -var="project_id=${{ secrets.GCP_PROJECT_ID }}" \
                      -var="region=us-central1" \
                      -out=tfplan

        # Apply the deployment
        terraform apply tfplan

        echo "Deployment completed!"

    - name: Get cluster info
      working-directory: ./terraform
      run: |
        echo "Getting cluster information..."
        terraform output cluster_name
        terraform output kubectl_config

        # Get ingress load balancer IP (may not be ready yet)
        echo "Ingress LoadBalancer IP:"
        terraform output load_balancer_ip

    - name: Update status
      run: |
        echo "✅ Infrastructure deployment completed successfully!"
        echo "📦 GKE Autopilot cluster is ready"
        echo "🔧 Operators installed: cert-manager, nginx-ingress, keda, redis, postgresql (CNPG)"
        echo "📝 Note: App deployments should be done separately via kubectl/helm"