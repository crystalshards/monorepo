name: Deploy to Production

on:
  # Deploy after CI passes on main branch
  workflow_run:
    workflows: ["Continuous Integration"]
    branches: [main]
    types:
      - completed
  # Allow manual deployment with approval
  workflow_dispatch:

jobs:
  deploy:
    name: Deploy GKE Infrastructure
    runs-on: ubuntu-latest
    environment: production
    # Only run if CI passed or if manually triggered with skip_ci_check
    if: >
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success')

    steps:
    - name: Check CI Status
      if: github.event_name == 'workflow_run'
      run: |
        echo "CI workflow conclusion: ${{ github.event.workflow_run.conclusion }}"
        if [ "${{ github.event.workflow_run.conclusion }}" != "success" ]; then
          echo "❌ CI checks failed. Deployment blocked."
          exit 1
        fi
        echo "✅ CI checks passed. Proceeding with deployment."

    - name: Checkout code
      uses: actions/checkout@v4

    - name: Authenticate to Google Cloud
      uses: google-github-actions/auth@v2
      with:
        credentials_json: ${{ secrets.GCP_SA_KEY }}

    - name: Setup Terraform
      uses: hashicorp/setup-terraform@v2
      with:
        terraform_version: 1.6.0
        cli_config_credentials_token: ${{ secrets.TF_API_TOKEN }}

    - name: Deploy with Terraform
      working-directory: ./terraform
      run: |
        echo "Deploying GKE Autopilot cluster and infrastructure..."

        # Initialize Terraform (GCS backend configured in main.tf)
        terraform init

        # Remove old GKE cluster and all K8s resources from state (for Autopilot migration)
        # This allows Terraform to create a fresh Autopilot cluster
        echo "Removing old cluster and Kubernetes resources from state..."
        terraform state list | grep -E '(kubernetes_|helm_release|kubectl_manifest)' | while read -r resource; do
          echo "Removing $resource from state..."
          terraform state rm "$resource" 2>/dev/null || true
        done
        terraform state rm 'google_container_cluster.primary' 2>/dev/null || echo "Cluster not in state"

        # Delete orphaned GKE cluster from GCP if it exists
        # This is necessary because we're migrating from standard to Autopilot
        echo "Checking for orphaned GKE cluster in GCP..."
        if gcloud container clusters describe crystalshards-cluster --region=us-central1 --project=${{ secrets.GCP_PROJECT_ID }} &>/dev/null; then
          echo "Found orphaned cluster, deleting it to make way for Autopilot cluster..."
          gcloud container clusters delete crystalshards-cluster \
            --region=us-central1 \
            --project=${{ secrets.GCP_PROJECT_ID }} \
            --quiet
          echo "Orphaned cluster deleted"
        else
          echo "No orphaned cluster found"
        fi

        # Plan the deployment
        terraform plan -var="project_id=${{ secrets.GCP_PROJECT_ID }}" \
                      -var="region=us-central1" \
                      -out=tfplan

        # Apply the deployment
        terraform apply tfplan

        echo "Deployment completed!"

    - name: Get cluster info
      working-directory: ./terraform
      run: |
        echo "Getting cluster information..."
        terraform output cluster_name
        terraform output kubectl_config

        # Get ingress load balancer IP (may not be ready yet)
        echo "Ingress LoadBalancer IP:"
        terraform output load_balancer_ip

    - name: Update status
      run: |
        echo "✅ Infrastructure deployment completed successfully!"
        echo "📦 GKE Autopilot cluster is ready"
        echo "🔧 Operators installed: cert-manager, nginx-ingress, keda, redis, postgresql (CNPG)"
        echo "📝 Note: App deployments should be done separately via kubectl/helm"