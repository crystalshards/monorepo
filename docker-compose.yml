version: '3.8'

services:
  # PostgreSQL Database
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: crystalshards_development
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./libraries/migrations:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Redis Cache & Queue
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # MinIO Object Storage
  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 20s
      retries: 3

  # MailHog for Development Email Testing
  mailhog:
    image: mailhog/mailhog:latest
    ports:
      - "1025:1025"  # SMTP
      - "8025:8025"  # Web UI

  # CrystalShards Registry App
  crystalshards:
    build:
      context: ./apps/crystalshards
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    environment:
      LUCKY_ENV: development
      DATABASE_URL: postgres://postgres:password@postgres/crystalshards_development
      REDIS_URL: redis://redis:6379
      SECRET_KEY_BASE: development_secret_key_base_change_in_production
      PORT: 3000
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./apps/crystalshards:/app
    command: ["lucky", "dev"]

  # CrystalDocs Documentation App
  crystaldocs:
    build:
      context: ./apps/crystaldocs
      dockerfile: Dockerfile
    ports:
      - "3001:3001"
    environment:
      LUCKY_ENV: development
      DATABASE_URL: postgres://postgres:password@postgres/crystaldocs_development
      SECRET_KEY_BASE: development_secret_key_base_change_in_production
      MINIO_ENDPOINT: http://minio:9000
      MINIO_ACCESS_KEY: minioadmin
      MINIO_SECRET_KEY: minioadmin
      PORT: 3001
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy
    volumes:
      - ./apps/crystaldocs:/app
    command: ["lucky", "dev"]

  # CrystalGigs Job Board App
  crystalgigs:
    build:
      context: ./apps/crystalgigs
      dockerfile: Dockerfile
    ports:
      - "3002:3002"
    environment:
      LUCKY_ENV: development
      DATABASE_URL: postgres://postgres:password@postgres/crystalgigs_development
      SECRET_KEY_BASE: development_secret_key_base_change_in_production
      PORT: 3002
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./apps/crystalgigs:/app
    command: ["lucky", "dev"]

  # CrystalBits Blog/Newsletter App
  crystalbits:
    build:
      context: ./apps/crystalbits
      dockerfile: Dockerfile
    ports:
      - "3003:3003"
    environment:
      LUCKY_ENV: development
      DATABASE_URL: postgres://postgres:password@postgres/crystalbits_development
      SECRET_KEY_BASE: development_secret_key_base_change_in_production
      PORT: 3003
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./apps/crystalbits:/app
    command: ["lucky", "dev"]

volumes:
  postgres_data:
  redis_data:
  minio_data: