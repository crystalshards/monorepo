version: '3.8'

services:
  # PostgreSQL Database
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: crystalshards_development
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      # The raw SQL in libraries/migrations is deliberately NOT mounted into
      # /docker-entrypoint-initdb.d. Each app owns its schema through its own
      # Avram migrations, run by `make migrate`, and mounting these files made
      # Postgres a second source of truth: on any fresh volume the init
      # scripts created users, shards and friends, and then every app's first
      # migration failed with "relation already exists". Two schema owners for
      # one database is the bug; the apps are the owner that ships.
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Object storage for local development. This container is the development
  # implementation of the apps' object store interface; production is Google
  # Cloud Storage and never runs this. MINIO_ROOT_* below configure the
  # container itself, which is why they keep the vendor's names; the apps read
  # backend-neutral STORAGE_* instead.
  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 20s
      retries: 3

  # MailHog for Development Email Testing
  mailhog:
    image: mailhog/mailhog:latest
    ports:
      - "1025:1025"  # SMTP
      - "8025:8025"  # Web UI

  # CrystalShards Registry App
  crystalshards:
    build:
      context: ./apps/crystalshards
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    environment:
      LUCKY_ENV: development
      DATABASE_URL: postgres://postgres:password@postgres/crystalshards_development
      SECRET_KEY_BASE: development_secret_key_base_change_in_production
      # The ad strip reads promotable jobs from CrystalGigs. Unset would turn
      # the strip off rather than break the app, so it is wired here to keep
      # development honest about what production renders.
      JOB_ADS_URL: http://crystalgigs:3002/api/ads
      PORT: 3000
      # Object storage. Backend-neutral names: the app talks to the interface,
      # not to a backend. No Google Cloud credentials are involved locally.
      STORAGE_ENDPOINT: http://minio:9000
      STORAGE_ACCESS_KEY: minioadmin
      STORAGE_SECRET_KEY: minioadmin
      DOCS_BUCKET: crystal-docs
      PACKAGES_BUCKET: packages
      # Every Bushido Collective site's origin, for the footer's cross links
      # and (DOCS_SITE_ORIGIN) for the documentation links this app itself
      # renders. Required, with no default in the code: a hardcoded
      # production URL made every link on a development machine point at
      # production, and nothing failed to reveal it.
      SHARDS_SITE_ORIGIN: http://localhost:3000
      DOCS_SITE_ORIGIN: http://localhost:3001
      # Where crystalgigs.com and crystalbits.org answer, browser-facing
      # rather than the internal Docker hostnames above: house ad links and
      # footer cross links have to be clickable from outside the Docker
      # network, the same reason DOCS_SITE_ORIGIN is localhost here rather
      # than the service name.
      GIGS_SITE_ORIGIN: http://localhost:3002
      BITS_SITE_ORIGIN: http://localhost:3003
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy
    volumes:
      - ./apps/crystalshards:/app
    command: ["lucky", "dev"]

  # CrystalDocs Documentation App
  crystaldocs:
    build:
      context: ./apps/crystaldocs
      dockerfile: Dockerfile
    ports:
      - "3001:3001"
    environment:
      LUCKY_ENV: development
      DATABASE_URL: postgres://postgres:password@postgres/crystaldocs_development
      SECRET_KEY_BASE: development_secret_key_base_change_in_production
      STORAGE_ENDPOINT: http://minio:9000
      STORAGE_ACCESS_KEY: minioadmin
      STORAGE_SECRET_KEY: minioadmin
      # Shared with CrystalShards, which writes what this app reads.
      DOCS_BUCKET: crystal-docs
      JOB_ADS_URL: http://crystalgigs:3002/api/ads
      PORT: 3001
      # All four site origins, for the footer's cross links and the house ad
      # links this app renders. Browser-facing rather than the internal Docker
      # hostnames, because a reader clicks these from outside the network. See
      # crystalshards' block above for why these have no default.
      SHARDS_SITE_ORIGIN: http://localhost:3000
      DOCS_SITE_ORIGIN: http://localhost:3001
      GIGS_SITE_ORIGIN: http://localhost:3002
      BITS_SITE_ORIGIN: http://localhost:3003
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy
    volumes:
      - ./apps/crystaldocs:/app
    command: ["lucky", "dev"]

  # CrystalGigs Job Board App
  crystalgigs:
    build:
      context: ./apps/crystalgigs
      dockerfile: Dockerfile
    ports:
      - "3002:3002"
    environment:
      LUCKY_ENV: development
      DATABASE_URL: postgres://postgres:password@postgres/crystalgigs_development
      SECRET_KEY_BASE: development_secret_key_base_change_in_production
      PORT: 3002
      # The other three sites' origins, for the footer's cross links. See
      # crystalshards' block above for why these have no default.
      SHARDS_SITE_ORIGIN: http://localhost:3000
      DOCS_SITE_ORIGIN: http://localhost:3001
      GIGS_SITE_ORIGIN: http://localhost:3002
      BITS_SITE_ORIGIN: http://localhost:3003
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./apps/crystalgigs:/app
    command: ["lucky", "dev"]

  # CrystalBits Blog/Newsletter App
  crystalbits:
    build:
      context: ./apps/crystalbits
      dockerfile: Dockerfile
    ports:
      - "3003:3003"
    environment:
      LUCKY_ENV: development
      DATABASE_URL: postgres://postgres:password@postgres/crystalbits_development
      SECRET_KEY_BASE: development_secret_key_base_change_in_production
      JOB_ADS_URL: http://crystalgigs:3002/api/ads
      PORT: 3003
      # The other three sites' origins, for the footer's cross links. See
      # crystalshards' block above for why these have no default.
      SHARDS_SITE_ORIGIN: http://localhost:3000
      DOCS_SITE_ORIGIN: http://localhost:3001
      GIGS_SITE_ORIGIN: http://localhost:3002
      BITS_SITE_ORIGIN: http://localhost:3003
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./apps/crystalbits:/app
    command: ["lucky", "dev"]

  # trycrystal Tutorial Console
  #
  # No DATABASE_URL and no depends_on postgres: this app has no database at
  # all, and progress lives in the visitor's browser.
  #
  # Unlike the four services above, this one does not override the image's
  # command with `lucky dev` and does not mount its source. The app images in
  # this repo are production images whose runtime stage carries neither the
  # Crystal toolchain nor the lucky CLI, so it runs the binary the image
  # builds. For a source-reloading loop, run the app outside compose with
  # `crystal run src/trycrystal.cr` (see apps/trycrystal/README.md) or use
  # `make dev`, which starts every app and the runner together.
  trycrystal:
    build:
      context: ./apps/trycrystal
      dockerfile: Dockerfile
    ports:
      - "3004:3004"
    environment:
      LUCKY_ENV: development
      SECRET_KEY_BASE: development_secret_key_base_change_in_production
      PORT: 3004
      # Where submissions are executed. Inside compose this is the runner
      # service by name; outside it, the app's own default is
      # http://localhost:9292. In production there is no default and the
      # revision refuses to boot without it, because an app pointed at a
      # localhost that does not exist looks healthy and answers every
      # submission with a sandbox that is not there.
      RUNNER_URL: http://trycrystal-runner:9292
      JOB_ADS_URL: http://crystalgigs:3002/api/ads
      # The other sites' origins, for the footer's cross links. See
      # crystalshards' block above for why these have no default.
      SHARDS_SITE_ORIGIN: http://localhost:3000
      DOCS_SITE_ORIGIN: http://localhost:3001
      GIGS_SITE_ORIGIN: http://localhost:3002
      BITS_SITE_ORIGIN: http://localhost:3003
    depends_on:
      trycrystal-runner:
        condition: service_healthy

  # The trycrystal sandbox runner: the process that compiles and executes a
  # visitor's Crystal. A separate deployable with its own Dockerfiles, and the
  # only container here that runs untrusted code on purpose.
  #
  # ALLOW_UNSAFE=true is the documented local-development waiver and the exact
  # string the gate accepts; nothing else is truthy to it. It runs the sandbox
  # LOOSE, which is acceptable on a developer's machine and is never set in
  # production, where TRYC_SANDBOX=cloudrun is what the deployed revision
  # carries. A runner handed neither refuses to start rather than serving
  # unconfined.
  #
  # THIS IS THE RUN-MODE IMAGE, AND PRODUCTION IS NOT.
  #
  # What deploys is Dockerfile.interpreter, whose first stage builds Crystal
  # from source with interpreter=1 (measured at about 335 seconds of compile
  # on an M5 Max) and which answers four to six times faster per submission.
  # Paying that build on `docker compose up` is not a trade a developer should
  # be forced into, so compose builds the fast run-mode image and says so
  # rather than pretending to be production. RUNNER_EXEC_MODE=run is set
  # explicitly for the same reason: this image carries no crystal-i, so the
  # mode is stated here instead of depending on whatever the binary's default
  # becomes.
  #
  # To run the deploy shape locally:
  #   docker build -f apps/trycrystal/runner/Dockerfile.interpreter \
  #     -t trycrystal-runner:interpreter apps/trycrystal/runner
  # then set `image: trycrystal-runner:interpreter` here in place of `build`.
  # CI's confinement proof runs against that image, never this one.
  trycrystal-runner:
    build:
      context: ./apps/trycrystal/runner
      dockerfile: Dockerfile
    ports:
      - "9292:9292"
    environment:
      PORT: 9292
      ALLOW_UNSAFE: "true"
      RUNNER_EXEC_MODE: run
    healthcheck:
      # The console depends on this being healthy, so the check has to be the
      # runner's own readiness rather than a port being open: /health answers
      # only once the runner has established its confinement.
      test: ["CMD-SHELL", "wget -q -O - http://localhost:9292/health >/dev/null 2>&1"]
      interval: 10s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
  minio_data:
