    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy
    volumes:
      - ./apps/crystalshards:/app
    command: ["lucky", "dev"]

  # CrystalDocs Documentation App
  crystaldocs:
    build:
      context: ./apps/crystaldocs
      dockerfile: Dockerfile
    ports:
      - "3001:3001"
    environment:
      LUCKY_ENV: development
      DATABASE_URL: postgres://postgres:password@postgres/crystaldocs_development
      SECRET_KEY_BASE: development_secret_key_base_change_in_production
      STORAGE_ENDPOINT: http://minio:9000
      STORAGE_ACCESS_KEY: minioadmin
      STORAGE_SECRET_KEY: minioadmin
      # Shared with CrystalShards, which writes what this app reads.
      DOCS_BUCKET: crystal-docs
      JOB_ADS_URL: http://crystalgigs:3002/api/ads
      # Where crystalgigs.com answers, browser-facing for the same reason
      # noted on CrystalShards above.
      GIGS_SITE_ORIGIN: http://localhost:3002
      PORT: 3001
      # The other three sites' origins, for the footer's cross links. See
      # crystalshards' block above for why these have no default.
      SHARDS_SITE_ORIGIN: http://localhost:3000
      DOCS_SITE_ORIGIN: http://localhost:3001
      GIGS_SITE_ORIGIN: http://localhost:3002
      BITS_SITE_ORIGIN: http://localhost:3003
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy
    volumes:
      - ./apps/crystaldocs:/app
    command: ["lucky", "dev"]

  # CrystalGigs Job Board App
  crystalgigs:
    build:
      context: ./apps/crystalgigs
      dockerfile: Dockerfile
    ports:
      - "3002:3002"
    environment:
      LUCKY_ENV: development
      DATABASE_URL: postgres://postgres:password@postgres/crystalgigs_development
      SECRET_KEY_BASE: development_secret_key_base_change_in_production
      PORT: 3002
      # The other three sites' origins, for the footer's cross links. See
      # crystalshards' block above for why these have no default.
      SHARDS_SITE_ORIGIN: http://localhost:3000
      DOCS_SITE_ORIGIN: http://localhost:3001
      GIGS_SITE_ORIGIN: http://localhost:3002
      BITS_SITE_ORIGIN: http://localhost:3003
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./apps/crystalgigs:/app
    command: ["lucky", "dev"]

  # CrystalBits Blog/Newsletter App
  crystalbits:
    build:
      context: ./apps/crystalbits
      dockerfile: Dockerfile
    ports:
      - "3003:3003"
    environment:
      LUCKY_ENV: development
      DATABASE_URL: postgres://postgres:password@postgres/crystalbits_development
      SECRET_KEY_BASE: development_secret_key_base_change_in_production
      JOB_ADS_URL: http://crystalgigs:3002/api/ads
      PORT: 3003
      # The other three sites' origins, for the footer's cross links. See
      # crystalshards' block above for why these have no default.
      SHARDS_SITE_ORIGIN: http://localhost:3000
      DOCS_SITE_ORIGIN: http://localhost:3001
      GIGS_SITE_ORIGIN: http://localhost:3002
      BITS_SITE_ORIGIN: http://localhost:3003
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./apps/crystalbits:/app
    command: ["lucky", "dev"]

volumes:
  postgres_data:
  minio_data:
