apiVersion: v1
kind: Namespace
metadata:
  name: "${NAMESPACE}"
---
apiVersion: v1
kind: Pod
metadata:
  name: "${POD_NAME}"
  namespace: "${NAMESPACE}"
spec:
  restartPolicy: Always
  securityContext:
    fsGroup: 1000
    fsGroupChangePolicy: "OnRootMismatch"
  containers:
    - name: dind
      image: docker:24-dind
      securityContext:
        privileged: true
      env:
        - name: DOCKER_TLS_CERTDIR
          value: "" # Disable TLS for simplicity in dev
      volumeMounts:
        - name: docker-storage
          mountPath: /var/lib/docker
        - name: workspaces
          mountPath: /workspaces
      resources:
        requests:
          memory: "2Gi"
          cpu: "1"
        limits:
          memory: "4Gi"
          cpu: "2"
    - name: agent
      image: ghcr.io/coder/envbuilder:latest
      imagePullPolicy: Always
      env:
        - name: DOCKER_HOST
          value: tcp://localhost:2375
        - name: ENVBUILDER_GIT_URL
          value: "${GIT_URL}"
        - name: ENVBUILDER_GIT_BRANCH
          value: "${GIT_BRANCH}"
        - name: ENVBUILDER_DEVCONTAINER_DIR
          value: /workspaces/monorepo/.devcontainer
        - name: ENVBUILDER_INIT_SCRIPT
          value: "/workspaces/monorepo/dev-agent/loop"
        - name: ENVBUILDER_WORKSPACE_FOLDER
          value: /workspaces/monorepo
        - name: ENVBUILDER_VERBOSE
          value: "true"
        - name: ENVBUILDER_GIT_CLONE_SINGLE_BRANCH
          value: "true"
        - name: ENVBUILDER_GIT_CLONE_DEPTH
          value: "1"
        - name: GITHUB_TOKEN
          valueFrom:
            secretKeyRef:
              name: github-secrets
              key: token
        - name: GH_TOKEN
          valueFrom:
            secretKeyRef:
              name: github-secrets
              key: token
        - name: ENVBUILDER_GIT_USERNAME
          value: x-access-token
        - name: ENVBUILDER_GIT_PASSWORD
          valueFrom:
            secretKeyRef:
              name: github-secrets
              key: token
        - name: GIT_AUTHOR_NAME
          value: "CrystalShards Agent"
        - name: GIT_AUTHOR_EMAIL
          value: "agent@crystalshards.org"
        - name: GIT_COMMITTER_NAME
          value: "CrystalShards Agent"
        - name: GIT_COMMITTER_EMAIL
          value: "agent@crystalshards.org"
      volumeMounts:
        - name: workspaces
          mountPath: /workspaces
        - name: prod-kubeconfig
          mountPath: /home/coder/.kube
          readOnly: true
      resources:
        requests:
          memory: "4Gi"
          cpu: "2"
        limits:
          memory: "8Gi"
          cpu: "4"
  volumes:
    - name: workspaces
      persistentVolumeClaim:
        claimName: crystalshards-workspaces
    - name: docker-storage
      persistentVolumeClaim:
        claimName: crystalshards-docker-storage
    - name: prod-kubeconfig
      secret:
        secretName: prod-kubeconfig
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: crystalshards-workspaces
  namespace: "${NAMESPACE}"
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 50Gi
  storageClassName: standard-rwo
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: crystalshards-docker-storage
  namespace: "${NAMESPACE}"
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 100Gi
  storageClassName: standard-rwo
---
apiVersion: v1
kind: Secret
metadata:
  name: github-secrets
  namespace: "${NAMESPACE}"
type: Opaque
stringData:
  token: "${GITHUB_TOKEN}"
